; Uploads — fotos de perfil/galería y las tandas del Taller de Contenido.
;
; post_max_size manda sobre el envío ENTERO, no sobre cada archivo: con el
; taller ella sube hasta 10 fotos de una, y diez fotos de teléfono a 4-5 MB
; pasaban los 20 MB anteriores y la subida moría con un error que no explica
; nada. 60M deja margen para esa tanda.
;
; El techo de arriba no es este archivo: el sitio va detrás de Cloudflare,
; que en los planes Free/Pro corta cualquier petición de más de 100 MB. Por
; eso subir video por esta vía no escala — eso necesita subida directa a R2,
; sin pasar por el servidor.
upload_max_filesize = 20M
post_max_size = 60M

memory_limit = 256M

; Opcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
