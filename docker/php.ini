; Uploads — fotos de perfil/galería y las tandas del Taller de Contenido.
;
; Los dos números tienen que cuadrar con lo que valida
; StoreContentUploadRequest, o PHP tira el archivo ANTES de que la validación
; pueda explicar por qué. Eso ya rompió en producción el 29-ago: post_max_size
; estaba en 60M pero upload_max_filesize seguía en 20M, así que un video de
; referencia de 30 MB lo descartaba PHP y llegaba un archivo sin ruta que
; reventaba con un 500 en vez de dar un mensaje.
;
;   upload_max_filesize  manda sobre CADA archivo  -> el video más grande (50 MB)
;   post_max_size        manda sobre el envío ENTERO -> 10 fotos x 8 MB = 80 MB
;
; El techo de arriba no es este archivo: el sitio va detrás de Cloudflare, que
; en los planes Free/Pro corta cualquier petición de más de 100 MB. Por eso
; post_max_size se queda en 90M y no más — y por eso el video de verdad, a
; futuro, necesita subida directa a R2 sin pasar por el servidor.
upload_max_filesize = 50M
post_max_size = 90M

memory_limit = 256M

; Opcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
