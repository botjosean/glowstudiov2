<!--
    La corona, suelta, para el ícono de la pestaña.

    Es la única copia del dibujo que no sale de resources/js/crown.js: este
    archivo lo sirve el servidor tal cual, sin pasar por el bundle, así que si
    allá se retoca un trazo hay que traerlo aquí a mano.

    Lleva el fondo azul y las esquinas redondeadas de los íconos de la pantalla
    de inicio, para que sea la misma app en la pestaña y en el teléfono. El
    trazo es más grueso que el de la marca de la barra a propósito: a 16px, que
    es como lo enseña el navegador, el trazo fino se convierte en una mancha.

    Tercera corona (26-ago-2026): cinco perlas de alambre sobre cuatro arcos
    con dos colas — la que más se parece a la foto que mandó el dueño. A
    diferencia de las dos anteriores, esta SÍ tiene relleno: las perlas son
    sólidas, no un contorno, así que hacen falta dos grupos donde antes
    bastaba uno.

    Las dos hojas que colgaban de los valles internos se quitaron el 30-ago:
    a tamaño real no se leían como hojas sino como dos rayas rectas que
    rompían la curva. Si se vuelve a tocar el dibujo, hay que REEXPORTAR los
    PNG de esta carpeta — no se generan solos.

    Y a diferencia de las dos anteriores, esta corona ocupa casi todo el ancho
    de su propio lienzo (192 de 200 unidades) en vez de dejar margen de sobra,
    así que aquí no basta con correrla hacia abajo: hace falta encogerla y
    centrarla. El translate(22 64) scale(0.78) está verificado —renderizado y
    mirado, no solo calculado— para que ni las colas ni las perlas de las
    puntas rocen las esquinas redondeadas.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <defs>
        <radialGradient id="bg" cx="50%" cy="44%" r="70%">
            <stop offset="0%" stop-color="#1B2740" />
            <stop offset="62%" stop-color="#0E1626" />
        </radialGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#B4744A" />
            <stop offset="45%" stop-color="#F5D9BC" />
            <stop offset="100%" stop-color="#A9683F" />
        </linearGradient>
    </defs>

    <rect width="200" height="200" rx="46" fill="url(#bg)" />

    <g transform="translate(22 64) scale(0.78)">
        <g
            fill="none"
            stroke="url(#gold)"
            stroke-width="10"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <!-- Los cuatro arcos -->
            <path d="M 12 39 C 20 88 42 88 50 27" />
            <path d="M 50 27 C 62 94 88 94 100 9" />
            <path d="M 100 9 C 112 94 138 94 150 27" />
            <path d="M 150 27 C 158 88 180 88 188 39" />
            <!-- Las dos colas -->
            <path d="M 12 39 C 14 56 24 72 35 88" />
            <path d="M 188 39 C 186 56 176 72 165 88" />
        </g>

        <g fill="url(#gold)">
            <!-- Las cinco perlas. Las dos hojas se quitaron el 30-ago: a
                 tamaño real se leían como dos rayas rectas colgando bajo la
                 segunda y la cuarta perla, y rompían la curva de todo lo
                 demás. Ver resources/js/crown.js. -->
            <circle cx="100" cy="9" r="8" />
            <circle cx="50" cy="27" r="6.5" />
            <circle cx="150" cy="27" r="6.5" />
            <circle cx="12" cy="39" r="6" />
            <circle cx="188" cy="39" r="6" />
        </g>
    </g>
</svg>
