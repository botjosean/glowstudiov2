<!--
    La misma corona, encogida para el ícono "maskable" de Android.

    Android recorta estos íconos con la forma que tenga el teléfono —círculo,
    cuadrado redondeado, gota— así que todo lo que importa tiene que caber en
    el círculo central del 80%. Por eso acá la corona va a scale(0.55) y no al
    0.78 de icon.svg: con el tamaño normal, las perlas de las puntas quedaban
    fuera del recorte en los teléfonos de máscara circular.

    Existía como PNG desde el 26-ago pero sin su fuente: al quitarle las hojas
    al dibujo (30-ago) hubo que reconstruirlo para poder reexportarlo. Si se
    vuelve a tocar la corona en resources/js/crown.js, hay que traer el cambio
    aquí y a icon.svg, y reexportar los cinco PNG de esta carpeta con:

        rsvg-convert -w 192 -h 192 icon-maskable.svg -o icon-maskable-192.png
        rsvg-convert -w 512 -h 512 icon-maskable.svg -o icon-maskable-512.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <defs>
        <radialGradient id="bg" cx="50%" cy="44%" r="70%">
            <stop offset="0%" stop-color="#1B2740" />
            <stop offset="62%" stop-color="#0E1626" />
        </radialGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#B4744A" />
            <stop offset="45%" stop-color="#F5D9BC" />
            <stop offset="100%" stop-color="#A9683F" />
        </linearGradient>
    </defs>

    <rect width="200" height="200" rx="46" fill="url(#bg)" />

    <g transform="translate(45 72) scale(0.55)">
        <g
            fill="none"
            stroke="url(#gold)"
            stroke-width="10"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <!-- Los cuatro arcos -->
            <path d="M 12 39 C 20 88 42 88 50 27" />
            <path d="M 50 27 C 62 94 88 94 100 9" />
            <path d="M 100 9 C 112 94 138 94 150 27" />
            <path d="M 150 27 C 158 88 180 88 188 39" />
            <!-- Las dos colas -->
            <path d="M 12 39 C 14 56 24 72 35 88" />
            <path d="M 188 39 C 186 56 176 72 165 88" />
        </g>

        <g fill="url(#gold)">
            <!-- Las cinco perlas -->
            <circle cx="100" cy="9" r="8" />
            <circle cx="50" cy="27" r="6.5" />
            <circle cx="150" cy="27" r="6.5" />
            <circle cx="12" cy="39" r="6" />
            <circle cx="188" cy="39" r="6" />
        </g>
    </g>
</svg>
